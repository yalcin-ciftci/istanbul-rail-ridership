version = 2

[[metric]]
id = "journey_count_estimated"
role = "default"
label_tr = "Analiz yolculuk sayısı"
definition_tr = "Analiz varsayılanı: tüm toplamlar ve yıllar arası karşılaştırmalar için yolculuk (turnike geçişi) sayısı. Şüpheli 2022 günlerinde kaynak değer giriş satırı düzeyinde tam sayı bölmesiyle ikiye bölünür; diğer günlerde journey_count ile aynıdır."
description_en = "Default measure for all analytical totals and comparisons across years. Sum of journeys with source counts divided by 2 using integer division per entrance row on suspect 2022 days; equals journey_count otherwise. The adjustment is a project estimate, not an official IBB figure."
tables = ["fct_station_daily", "fct_line_daily", "fct_station_group_daily"]

[[metric]]
id = "journey_count"
role = "source"
label_tr = "Kaynak yolculuk sayısı (İBB)"
definition_tr = "İBB kaynak yolculuk (turnike geçişi) değerlerinin toplamı; şüpheli günlerdeki kaynak değerleri korur. Kullanıcı kaynak sayıyı istediğinde veya tahminle yan yana gösterirken kullanılır."
description_en = "Sum of source journey counts (turnstile passages), preserving suspect source values. Use when the user requests IBB source counts or to display them alongside journey_count_estimated."
tables = ["fct_station_daily", "fct_line_daily", "fct_station_group_daily"]

[[metric]]
id = "passenger_count"
role = "restricted"
label_tr = "Kaynak yolcu sayımı"
definition_tr = "Kaynak yolcu sayımlarının toplamı; aynı kişiyi birden fazla sayabilir, tekil kişi sayısı değildir ve yıllar arası karşılaştırmada kullanılmaz."
description_en = "Sum of source passenger counts; may count the same person more than once. Not a count of unique people; do not use for comparisons across years."
tables = ["fct_station_daily", "fct_line_daily", "fct_station_group_daily"]

[[rule]]
id = "default_metric"
text_tr = "Analiz varsayılanı journey_count_estimated'dır; tüm toplamları ve yıllar arası karşılaştırmaları bu ölçüyle yap. Şüpheli 2022 günleri dışında journey_count ile aynıdır. journey_count kaynak değeri (İBB) olarak korunur; kullanıcı kaynak sayıyı isterse veya tahminle yan yana gösterirken kullan. Yolculuk, turnike geçişidir; kullandığın ölçünün ne olduğunu cevapta bir cümleyle söyle."

[[rule]]
id = "suspect_warning"
text_tr = "2022-03-28 ile 2022-11-07 arasındaki 225 işaretli günde kaynak journey_count değerleri iki katına çıkmış görünüyor. Sonuç aralığında has_suspect_journeys = true olan gün varsa bunun İBB'nin değil projenin tahmini olduğunu cevapta belirt; böyle bir gün yoksa tahmin uyarısı zorunlu değildir. Toplam alırken bu bayrağı da kontrol et."

[[rule]]
id = "hourly_override"
text_tr = "2022-10-31, 2022-11-01, 2022-11-03, 2022-11-04, 2022-11-05, 2022-11-06 ve 2022-11-07 sezgisel kuralın dışında kalan, saatlik veriyle iki kat sayım doğrulanmış ek tarih listesidir (journey_suspect_overrides seed). Bu 7 gün de şüpheli olarak işaretlenir; journey_count_estimated giriş satırı düzeyinde journey_count // 2 kullanır. Bu günleri içeren cevaplarda düzeltmenin projenin tahmini olduğunu açıkla."

[[rule]]
id = "passenger_not_people"
text_tr = "passenger_count aynı kişiyi birden fazla sayabilir; tekil kişi sayısı değildir ve yıllar arası karşılaştırmada kullanılmaz."

[[rule]]
id = "station_group"
text_tr = "İstasyon, fiziksel istasyon grubudur (kompleks); birden çok kod ve hat içerebilir. En kalabalık istasyonu gruba göre hesapla. İstasyon grupları gözden geçirilmiş bir eşleme tablosudur; İBB kaynak alanı değildir."

[[rule]]
id = "line_level"
text_tr = "İstasyonu olmayan hat düzeyindeki satırlar yalnızca fct_line_daily içindedir; istasyon toplamlarının toplamı hat toplamına eşit olmayabilir."

[[rule]]
id = "district"
text_tr = "Kaynaktaki ilçe alanı (district, districts) güvenilir değildir; ilçe bazlı sonuçları bu uyarıyla verin ve ek doğrulama gerektiğini belirtin."

[[rule]]
id = "weekend"
text_tr = "Hafta sonu Cumartesi–Pazar olarak tanımlanır. Resmî/dini tatiller ve tam gün kısıtlamaları `marts.dim_calendar_day` tablosunda işaretlidir. Hafta içi/sonu karşılaştırmalarında varsayılan tanım takvim günüdür (tatiller hariç tutulmaz); aralıkta hafta içine düşen tam gün tatil ve tam gün kısıtlama günlerinin sayısını cevapta bir cümleyle söyle. Kullanıcı 'tatiller hariç', 'normal iş günü' gibi bir şey isterse `is_regular_workday = true` kullan ve bunu açıkça yaz. Takvim etiketi bir günün neden farklı olduğunun kanıtı değildir."

[[rule]]
id = "source_license"
text_tr = "Kaynak: İBB Açık Veri, İBB Açık Veri Lisansı (CC BY 4.0); kaynak belirtin."

[[rule]]
id = "data_version"
text_tr = "Sayı verdiğin cevabın sonunda kullandığın veri sürümünü yaz (sorgu sonucundaki veri_surumu kimliği). Kimlik boşsa bunu söyle; aynı soru aynı kimlikte aynı sonucu vermelidir."

[[metric]]
id = "typical_hourly_passage"
role = "analysis"
label_tr = "Tipik saatlik turnike geçişi"
definition_tr = "Taban dönemde o gün tipi ve saatte tipik (medyan) turnike geçişi."
description_en = "Median hourly turnstile passages on baseline days, with missing hours filled with zero; baseline 2023-01-01 to 2024-07-31, holidays not separated. Not unique people or train occupancy."
column = "typical_passage"
tables = ["fct_station_group_hour_profile"]

[[metric]]
id = "relative_hourly_intensity"
role = "interpretation"
label_tr = "Göreli saatlik yoğunluk"
definition_tr = "Grubun en yoğun tipik saatinin yüzde kaçı: relative_index × 100; quiet ≤0,33, moderate ≤0,66, busy >0,66."
description_en = "Typical passages divided by the station group peak across all day types and hours (0–1); quiet <= 0.33, moderate <= 0.66, busy > 0.66. Baseline 2023-01-01 to 2024-07-31, holidays not separated; turnstile passages, not unique people or train occupancy. Interpret only when reliability is ok."
column = "relative_index"
tables = ["fct_station_group_hour_profile"]

[[rule]]
id = "hourly_typical"
text_tr = "Saatlik profil tipik bir günü anlatır; belirli bir tarih ve saatin geçiş sayısı değildir. Tipik saatlik geçiş için typical_passage ölçüsünü kullan; medyan olduğunu belirt."

[[rule]]
id = "hourly_reliability"
text_tr = "reliability ok değilse bayrağı söyle ve endeksi yorumlama: few_days, baseline_days < 20; low_volume, peak_reference < 50; aksi ok. Öncelik few_days → low_volume → ok; satırlar filtrelenmez."

[[rule]]
id = "hourly_scope"
text_tr = "Saatlik profil tabanı 2023-01-01…2024-07-31 dönemidir; resmî tatiller ayrılmaz. Saatlik ham veri 2020-01…2024-10 dönemini kapsar."

[[rule]]
id = "hourly_relative"
text_tr = "Yoğunluğu en yoğun saatin %X'i diye anlat: relative_index × 100; quiet ≤0,33, moderate ≤0,66, busy >0,66. Ölçü turnike geçişidir; tekil kişi ya da tren doluluğu değildir. Saatlik profil cevabında sorgu sonucundaki saatlik_veri_surumu kimliğini de yaz; boşsa bunu söyle."

[[rule]]
id = "daily_line_gap"
text_tr = "Günlük veride bazı hatlar dönem dönem yoktur (ör. M9 2022–2023, M8/F4/havalimanı TCDD hattı 2024 öncesi); bu hat-yıllar `marts.fct_line_daily_gap_year` tablosundadır. Bir hat ya da sistem toplamı bu yılları içeriyorsa veya yıllar arası karşılaştırma yapılıyorsa tabloya bak; eksik hat-yılını ve saatlik veriden alt sınır tahminini (`hourly_passage_in_gap`) cevapta belirt; eksik yılı 0 yolculuk diye sunma; tahmini günlük toplama ekleme."
