[[case]]
id = "busiest_stations_2025"
question_tr = "2025'te en kalabalık 10 istasyon hangileri?"
reference_sql = """
SELECT station_group, sum(journey_count_estimated) AS journeys
FROM marts.fct_station_group_daily
WHERE ride_date >= DATE '2025-01-01' AND ride_date < DATE '2026-01-01'
GROUP BY station_group
ORDER BY journeys DESC, station_group
LIMIT 10
"""
numbers = ["journeys"]
number_rows = 3
must_mention = ["(?i)turnike|geçiş"]
must_not_mention = []
rules = ["default_metric", "station_group"]
refusal = false

[[case]]
id = "m4_weekday_weekend_2025"
question_tr = "M4 hattının 2025 hafta içi ve hafta sonu günlük ortalama yolculukları kaç? Tam sayıya yuvarla ve hafta sonu tanımını belirt."
reference_sql = """
WITH daily AS (
    SELECT f.ride_date, sum(f.journey_count_estimated) AS journeys
    FROM marts.fct_line_daily AS f
    JOIN marts.dim_line AS d ON f.line_name = d.line_name
    WHERE d.line_code = 'M4'
      AND f.ride_date >= DATE '2025-01-01' AND f.ride_date < DATE '2026-01-01'
    GROUP BY f.ride_date
)
SELECT CASE WHEN isodow(ride_date) IN (6, 7) THEN 'weekend' ELSE 'weekday' END AS day_type,
       round(avg(journeys)) AS journeys
FROM daily
GROUP BY day_type
ORDER BY day_type
"""
numbers = ["journeys"]
must_mention = ["(?i)cumartesi", "(?i)pazar"]
must_not_mention = []
rules = ["default_metric", "weekend"]
refusal = false

[[case]]
id = "yenikapi_monthly_2025"
question_tr = "Yenikapı istasyon grubunun 2025 aylık yolculuk toplamlarını ver; en düşük ve en yüksek ayları belirt."
reference_sql = """
WITH monthly AS (
    SELECT date_trunc('month', ride_date)::DATE AS month,
           sum(journey_count_estimated) AS journeys
    FROM marts.fct_station_group_daily
    WHERE station_group = 'Yenikapı'
      AND ride_date >= DATE '2025-01-01' AND ride_date < DATE '2026-01-01'
    GROUP BY month
), ranked AS (
    SELECT month, journeys,
           row_number() OVER (ORDER BY journeys, month) AS low_rank,
           row_number() OVER (ORDER BY journeys DESC, month DESC) AS high_rank
    FROM monthly
)
SELECT month, journeys FROM ranked
WHERE low_rank = 1 OR high_rank = 1
ORDER BY journeys, month
"""
numbers = ["journeys"]
must_mention = ["(?i)turnike|geçiş"]
must_not_mention = []
rules = ["default_metric", "station_group"]
refusal = false

[[case]]
id = "kucukcekmece_district_2025"
question_tr = "Kaynak ilçe alanında Küçükçekmece olarak geçen istasyon gruplarının 2025 toplam yolculuğu kaç? İlçe bilgisinin güvenilirliğini açıkla."
reference_sql = """
SELECT sum(f.journey_count_estimated) AS journeys
FROM marts.fct_station_group_daily AS f
WHERE f.ride_date >= DATE '2025-01-01' AND f.ride_date < DATE '2026-01-01'
  AND EXISTS (
      SELECT 1 FROM marts.dim_station AS d
      WHERE d.station_group = f.station_group AND upper(d.district) = 'KÜÇÜKÇEKMECE'
  )
"""
numbers = ["journeys"]
must_mention = ["(?i)güvenilir|doğrula"]
must_not_mention = []
rules = ["default_metric", "district", "station_group"]
refusal = false

