[[case]]
id = "suspect_2022_m2"
question_tr = "M2 hattının 2022 yıllık toplam yolculuğu kaç? Tahminle ilgili uyarıyı açıkla."
reference_sql = """
SELECT sum(f.journey_count_estimated) AS journeys,
       bool_or(f.has_suspect_journeys) AS has_suspect_journeys
FROM marts.fct_line_daily AS f
JOIN marts.dim_line AS d ON f.line_name = d.line_name
WHERE d.line_code = 'M2'
  AND f.ride_date >= DATE '2022-01-01' AND f.ride_date < DATE '2023-01-01'
"""
numbers = ["journeys"]
must_mention = ["(?i)tahmin"]
must_not_mention = []
rules = ["suspect_warning"]
refusal = false

