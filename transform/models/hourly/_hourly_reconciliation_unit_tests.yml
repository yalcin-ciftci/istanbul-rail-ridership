- name: reconciliation_day_excludes_one_sided_and_no_overlap
  model: fct_hourly_daily_reconciliation_day
  given:
  - input: ref('fct_hourly_daily_reconciliation')
    format: sql
    rows: 'select date ''2023-01-02'' as ride_date, ''Both'' as station_group, ''2023-01''
      as month, 100 as hourly_passage, 200 as daily_journey_count, 100 as daily_journey_estimated,
      true as has_suspect_journeys, null::double as ratio_to_source, null::double
      as ratio_to_estimate, ''ok'' as hourly_month_flag, ''match'' as status

      union all

      select date ''2023-01-02'' as ride_date, ''D'' as station_group, ''2023-01''
      as month, null as hourly_passage, 900 as daily_journey_count, 900 as daily_journey_estimated,
      false as has_suspect_journeys, null::double as ratio_to_source, null::double
      as ratio_to_estimate, ''ok'' as hourly_month_flag, ''only_daily'' as status

      union all

      select date ''2023-01-02'' as ride_date, ''H'' as station_group, ''2023-01''
      as month, 800 as hourly_passage, null as daily_journey_count, null as daily_journey_estimated,
      null as has_suspect_journeys, null::double as ratio_to_source, null::double
      as ratio_to_estimate, ''ok'' as hourly_month_flag, ''only_hourly'' as status

      union all

      select date ''2023-01-03'' as ride_date, ''D'' as station_group, ''2023-01''
      as month, 0 as hourly_passage, 100 as daily_journey_count, 100 as daily_journey_estimated,
      false as has_suspect_journeys, null::double as ratio_to_source, null::double
      as ratio_to_estimate, ''ok'' as hourly_month_flag, ''only_daily'' as status

      union all

      select date ''2023-01-03'' as ride_date, ''H'' as station_group, ''2023-01''
      as month, 100 as hourly_passage, 0 as daily_journey_count, 0 as daily_journey_estimated,
      false as has_suspect_journeys, null::double as ratio_to_source, null::double
      as ratio_to_estimate, ''ok'' as hourly_month_flag, ''only_hourly'' as status

      union all

      select date ''2023-01-04'' as ride_date, ''Both'' as station_group, ''2023-01''
      as month, 100 as hourly_passage, 100 as daily_journey_count, 100 as daily_journey_estimated,
      false as has_suspect_journeys, null::double as ratio_to_source, null::double
      as ratio_to_estimate, ''low_volume'' as hourly_month_flag, ''hourly_incomplete''
      as status

      union all

      select date ''2023-01-05'' as ride_date, ''Both'' as station_group, ''2023-01''
      as month, 50 as hourly_passage, 100 as daily_journey_count, 100 as daily_journey_estimated,
      false as has_suspect_journeys, null::double as ratio_to_source, null::double
      as ratio_to_estimate, ''ok'' as hourly_month_flag, ''daily_doubled'' as status

      union all

      select date ''2023-01-06'' as ride_date, ''Both'' as station_group, ''2023-01''
      as month, 80 as hourly_passage, 100 as daily_journey_count, 100 as daily_journey_estimated,
      false as has_suspect_journeys, null::double as ratio_to_source, null::double
      as ratio_to_estimate, ''ok'' as hourly_month_flag, ''mismatch'' as status'
  expect:
    rows:
    - ride_date: '2023-01-02'
      groups_both: 1
      groups_only_daily: 1
      groups_only_hourly: 1
      hourly_passage: 100
      daily_journey_count: 200
      daily_journey_estimated: 100
      has_suspect_journeys: true
      ratio_to_source: 0.5
      ratio_to_estimate: 1
      status: match
    - ride_date: '2023-01-03'
      groups_both: 0
      groups_only_daily: 1
      groups_only_hourly: 1
      hourly_passage: null
      daily_journey_count: null
      daily_journey_estimated: null
      has_suspect_journeys: false
      ratio_to_source: null
      ratio_to_estimate: null
      status: no_overlap
    - ride_date: '2023-01-04'
      groups_both: 1
      groups_only_daily: 0
      groups_only_hourly: 0
      hourly_passage: 100
      daily_journey_count: 100
      daily_journey_estimated: 100
      has_suspect_journeys: false
      ratio_to_source: 1.0
      ratio_to_estimate: 1.0
      status: hourly_incomplete
    - ride_date: '2023-01-05'
      groups_both: 1
      groups_only_daily: 0
      groups_only_hourly: 0
      hourly_passage: 50
      daily_journey_count: 100
      daily_journey_estimated: 100
      has_suspect_journeys: false
      ratio_to_source: 0.5
      ratio_to_estimate: 0.5
      status: daily_doubled
    - ride_date: '2023-01-06'
      groups_both: 1
      groups_only_daily: 0
      groups_only_hourly: 0
      hourly_passage: 80
      daily_journey_count: 100
      daily_journey_estimated: 100
      has_suspect_journeys: false
      ratio_to_source: 0.8
      ratio_to_estimate: 0.8
      status: mismatch
