version: 2
unit_tests:
- name: test_calendar_inclusive_ranges_and_order
  model: int_calendar_day
  given:
  - input: ref('calendar_events')
    rows:
    - start_date: '2024-01-01'
      end_date: '2024-01-03'
      event_type: religious_holiday
      label_tr: Z
      scope: national
      partial_day: false
      source_url: https://example.org
    - start_date: '2024-01-02'
      end_date: '2024-01-02'
      event_type: public_holiday
      label_tr: B
      scope: national
      partial_day: false
      source_url: https://example.org
    - start_date: '2024-01-02'
      end_date: '2024-01-02'
      event_type: public_holiday
      label_tr: A
      scope: national
      partial_day: true
      source_url: https://example.org
    - start_date: '2024-01-04'
      end_date: '2024-01-04'
      event_type: religious_holiday
      label_tr: Half
      scope: national
      partial_day: true
      source_url: https://example.org
  expect:
    rows:
    - ride_date: '2024-01-01'
      event_types: religious_holiday
      labels: Z
      is_holiday: true
      is_half_day_holiday: false
      is_covid_restriction: false
      is_partial_covid_restriction: false
      has_special_event: false
    - ride_date: '2024-01-02'
      event_types: public_holiday,religious_holiday
      labels: A | B | Z
      is_holiday: true
      is_half_day_holiday: false
      is_covid_restriction: false
      is_partial_covid_restriction: false
      has_special_event: false
    - ride_date: '2024-01-03'
      event_types: religious_holiday
      labels: Z
      is_holiday: true
      is_half_day_holiday: false
      is_covid_restriction: false
      is_partial_covid_restriction: false
      has_special_event: false
    - ride_date: '2024-01-04'
      event_types: religious_holiday
      labels: Half
      is_holiday: false
      is_half_day_holiday: true
      is_covid_restriction: false
      is_partial_covid_restriction: false
      has_special_event: false
- name: test_calendar_full_and_partial_restrictions
  model: int_calendar_day
  given:
  - input: ref('calendar_events')
    rows:
    - start_date: '2024-02-01'
      end_date: '2024-02-02'
      event_type: covid_restriction
      label_tr: Partial
      scope: national
      partial_day: true
      source_url: https://example.org
    - start_date: '2024-02-02'
      end_date: '2024-02-02'
      event_type: covid_restriction
      label_tr: Full
      scope: national
      partial_day: false
      source_url: https://example.org
    - start_date: '2024-02-02'
      end_date: '2024-02-02'
      event_type: special_event
      label_tr: Event
      scope: national
      partial_day: false
      source_url: https://example.org
  expect:
    rows:
    - ride_date: '2024-02-01'
      event_types: covid_restriction
      labels: Partial
      is_holiday: false
      is_half_day_holiday: false
      is_covid_restriction: false
      is_partial_covid_restriction: true
      has_special_event: false
    - ride_date: '2024-02-02'
      event_types: covid_restriction,special_event
      labels: Full | Partial | Event
      is_holiday: false
      is_half_day_holiday: false
      is_covid_restriction: true
      is_partial_covid_restriction: false
      has_special_event: true
