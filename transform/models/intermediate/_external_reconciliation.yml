version: 2
unit_tests:
- name: external_reconciliation_ratios_and_operator_gap
  model: int_external_reconciliation_year
  given:
  - input: ref('external_annual_totals')
    rows:
    - year: 2022
      operator: metro_istanbul
      measure: annual_passengers
      value: 200
      source_url: https://example.invalid/2022
      source_page: s.1
    - year: 2023
      operator: metro_istanbul
      measure: annual_passengers
      value: 100
      source_url: https://example.invalid/2023
      source_page: s.2
  - input: ref('fct_line_daily')
    rows:
    - ride_date: '2022-01-01'
      line_name: M1
      journey_count_estimated: 80
      journey_count: 160
    - ride_date: '2022-12-31'
      line_name: M2
      journey_count_estimated: 100
      journey_count: 200
    - ride_date: '2022-01-01'
      line_name: TCDD X
      journey_count_estimated: 999
      journey_count: 999
    - ride_date: '2022-01-01'
      line_name: IETT X
      journey_count_estimated: 999
      journey_count: 999
    - ride_date: '2023-01-01'
      line_name: M1
      journey_count_estimated: 100
      journey_count: 100
  - input: ref('fct_line_daily_gap_year')
    rows:
    - year: 2022
      daily_line_name: M8
      hourly_passage_in_gap: 20
    - year: 2022
      daily_line_name: TCDD X
      hourly_passage_in_gap: 999
    - year: 2022
      daily_line_name: IETT X
      hourly_passage_in_gap: 999
  expect:
    rows:
    - year: 2022
      operator: metro_istanbul
      report_value: 200
      daily_journey_estimated: 180
      daily_journey_count: 360
      ratio_estimated: 0.9
      ratio_source: 1.8
      gap_lower_bound: 20
      ratio_with_gap: 1.0
    - year: 2023
      operator: metro_istanbul
      report_value: 100
      daily_journey_estimated: 100
      daily_journey_count: 100
      ratio_estimated: 1.0
      ratio_source: 1.0
      gap_lower_bound: 0
      ratio_with_gap: 1.0
- name: external_line_missing_gap_and_boundaries
  model: int_external_reconciliation_line_year
  given:
  - input: ref('external_annual_totals')
    format: sql
    rows: |
      select 2024 as year, 'metro_istanbul' as operator,
          'annual_passengers' as measure, line_code, 100::bigint as value
      from (values ('M1'), ('M2'), ('M3'), ('M4'), ('M5'), ('M6'), ('M7'), ('M8')) as r(line_code)
      union all
      select 2024, 'metro_istanbul', 'annual_passengers', null, 800
  - input: ref('external_line_map')
    format: sql
    rows: |
      select line_code, line_code as daily_line_name
      from (values ('M1'), ('M2'), ('M3'), ('M4'), ('M5'), ('M6'), ('M7'), ('M8')) as m(line_code)
  - input: ref('fct_line_daily')
    rows:
    - {ride_date: '2024-01-01', line_name: M1, journey_count_estimated: 40}
    - {ride_date: '2024-01-02', line_name: M1, journey_count_estimated: 55}
    - {ride_date: '2024-01-01', line_name: M2, journey_count_estimated: 105}
    - {ride_date: '2024-01-01', line_name: M3, journey_count_estimated: 94}
    - {ride_date: '2024-01-01', line_name: M4, journey_count_estimated: 106}
    - {ride_date: '2024-01-01', line_name: M7, journey_count_estimated: 85}
    - {ride_date: '2023-01-01', line_name: M8, journey_count_estimated: 100}
  - input: ref('fct_line_daily_gap_year')
    rows:
    - {year: 2024, daily_line_name: M5, hourly_passage_in_gap: 99}
    - {year: 2024, daily_line_name: M7, hourly_passage_in_gap: 10}
    - {year: 2023, daily_line_name: M8, hourly_passage_in_gap: 100}
  expect:
    rows:
    - {year: 2024, line_code: M1, daily_line_name: M1, report_value: 100, daily_journey_estimated: 95, ratio_estimated: 0.95, gap_lower_bound: 0, ratio_with_gap: 0.95, status: ok}
    - {year: 2024, line_code: M2, daily_line_name: M2, report_value: 100, daily_journey_estimated: 105, ratio_estimated: 1.05, gap_lower_bound: 0, ratio_with_gap: 1.05, status: ok}
    - {year: 2024, line_code: M3, daily_line_name: M3, report_value: 100, daily_journey_estimated: 94, ratio_estimated: 0.94, gap_lower_bound: 0, ratio_with_gap: 0.94, status: low}
    - {year: 2024, line_code: M4, daily_line_name: M4, report_value: 100, daily_journey_estimated: 106, ratio_estimated: 1.06, gap_lower_bound: 0, ratio_with_gap: 1.06, status: high}
    - {year: 2024, line_code: M5, daily_line_name: M5, report_value: 100, daily_journey_estimated: null, ratio_estimated: null, gap_lower_bound: 99, ratio_with_gap: 0.99, status: missing_in_daily}
    - {year: 2024, line_code: M6, daily_line_name: M6, report_value: 100, daily_journey_estimated: null, ratio_estimated: null, gap_lower_bound: 0, ratio_with_gap: 0.0, status: missing_in_daily}
    - {year: 2024, line_code: M7, daily_line_name: M7, report_value: 100, daily_journey_estimated: 85, ratio_estimated: 0.85, gap_lower_bound: 10, ratio_with_gap: 0.95, status: ok}
    - {year: 2024, line_code: M8, daily_line_name: M8, report_value: 100, daily_journey_estimated: null, ratio_estimated: null, gap_lower_bound: 0, ratio_with_gap: 0.0, status: missing_in_daily}
seeds:
- name: external_annual_totals
  description: Metro İstanbul faaliyet raporlarındaki yıllık yolcu serisi; intermediate
    şemasında, marts ve ajana açılmaz. Kaynaklar görevde verilen yerel araştırmadan
    alınmıştır.
  data_tests:
  - unique:
      arguments:
        column_name: struct_pack(year := year, operator := operator, measure := measure, line_code := line_code)
  columns:
  - name: year
    description: Rapor yılı.
    data_tests:
    - not_null
  - name: operator
    description: 'İşletmeci: metro_istanbul.'
    data_tests:
    - not_null
  - name: measure
    description: 'Rapor ölçüsü: annual_passengers.'
    data_tests:
    - not_null
  - name: value
    description: Raporda yayımlanan yıllık yolcu toplamı.
    data_tests:
    - not_null
  - name: source_url
    description: Faaliyet raporunun kaynak adresi.
    data_tests:
    - not_null
  - name: source_page
    description: Raporda basılı sayfa numarası.
    data_tests:
    - not_null
  - name: line_code
    description: Rapor hat kodu; sistem toplamlarında NULL.
  - name: note
    description: Kaynaklar arasındaki fark ve tarihsel seri notu.
- name: external_line_map
  description: Rapor hat kodunun günlük veri kümesindeki hat adına eşlemesi; intermediate içinde kalır.
  columns:
  - name: line_code
    data_tests: [not_null, unique]
  - name: daily_line_name
    data_tests: [not_null, unique]
models:
- name: int_external_reconciliation_year
  description: 'Yıl × işletmeci dış sağlama view''ı. Metro İstanbul hat kümesi: fct_line_daily
    içinde line_name ''TCDD%'' ve ''IETT%'' ile başlamayan hatlar. M8 işletmesi 31.12.2022''de
    Metro İstanbul''a devredildi. Rapor yolcu serisi ile günlük turnike geçişlerini
    karşılaştırır; gap eklenmiş oran yalnız tanısaldır, günlük toplam düzeltilmez.
    2024-11 sonrası boşluk saatlik veriden ölçülemez. Marts''a ve analiz kopyasına
    açılmaz.'
  data_tests:
  - unique:
      arguments:
        column_name: struct_pack(year := year, operator := operator)
  columns:
  - name: year
    description: Rapor yılı.
    data_tests:
    - not_null
  - name: operator
    description: İşletmeci.
    data_tests:
    - not_null
  - name: report_value
    description: Faaliyet raporundaki yıllık yolcu toplamı.
    data_tests:
    - not_null
  - name: daily_journey_estimated
    description: Tanımlı Metro İstanbul hat kümesinin günlük tahmin toplamı.
    data_tests:
    - not_null
  - name: daily_journey_count
    description: Aynı hat kümesinin korunmuş günlük kaynak toplamı.
    data_tests:
    - not_null
  - name: ratio_estimated
    description: daily_journey_estimated / report_value.
    data_tests:
    - not_null
  - name: ratio_source
    description: daily_journey_count / report_value; 2022 kaynak şişmesini korur.
    data_tests:
    - not_null
  - name: gap_lower_bound
    description: Aynı yıl ve hat kümesinde saatlik veriden ölçülen boşluk alt sınırı;
      yoksa 0.
    data_tests:
    - not_null
  - name: ratio_with_gap
    description: (daily_journey_estimated + gap_lower_bound) / report_value; yalnız
      tanısal dış sağlama, günlük toplam düzeltmesi değildir.
    data_tests:
    - not_null
  - name: source_url
    description: Faaliyet raporunun kaynak adresi.
    data_tests:
    - not_null
  - name: source_page
    description: Raporda basılı sayfa numarası.
    data_tests:
    - not_null
- name: int_external_reconciliation_line_year
  description: >-
    Yıl × rapor hat kodu karşılaştırması. Günlük satırı olmayan hat-yıl NULL kalır;
    boşluk alt sınırı yalnız tanısal orana eklenir. Marts ve ajana açılmaz.
  data_tests:
  - unique:
      arguments:
        column_name: struct_pack(year := year, line_code := line_code)
  columns:
  - name: year
    data_tests: [not_null]
  - name: line_code
    data_tests: [not_null]
  - name: daily_line_name
    data_tests: [not_null]
  - name: report_value
    description: Faaliyet raporundaki hat bazında yıllık yolcu sayısı.
    data_tests: [not_null]
  - name: daily_journey_estimated
    description: Günlük tahmin toplamı; hat-yıl satırı yoksa NULL, ölçülmüş sıfır değildir.
  - name: ratio_estimated
    description: Günlük tahmin / rapor; günlük veri yoksa NULL.
  - name: gap_lower_bound
    description: Aynı hat-yıl için saatlik veriden ölçülen boşluk; yoksa 0.
    data_tests: [not_null]
  - name: ratio_with_gap
    description: (COALESCE(günlük tahmin, 0) + boşluk alt sınırı) / rapor; yalnız tanısal.
    data_tests: [not_null]
  - name: status
    description: Günlük yoksa missing_in_daily; boşlukla oran 0,95–1,05 dahil ok, altında low, üstünde high.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [missing_in_daily, ok, low, high]
