version: 2
models:
- name: stg_rail_station_daily
  description: >
    Typed entrance-day ridership preserving every source row and repairing
    Turkish mojibake in line, station and district names. Summed passenger_count
    may count people more than once, especially in finer-grained 2021 and 2024;
    compare years with journey_count. Line-level rows have no station and
    appear only in fct_line_daily among the fact tables.
  columns:
  - name: row_key
    description: Resource and source row identifier.
    data_tests:
    - unique
    - not_null
  - name: source_row_id
    description: Original source row identifier.
    data_tests:
    - not_null
  - name: resource_id
    description: CKAN resource identifier.
    data_tests:
    - not_null
  - name: ride_date
    description: Date of rides.
    data_tests:
    - not_null
  - name: line_name
    description: Rail line name.
    data_tests:
    - not_null
  - name: station_code
    description: Source station code; null for line totals.
  - name: station_name
    description: Repaired station name; may also be null when a station code exists.
  - name: is_line_level
    description: Whether the source row is a line total without a station.
    data_tests:
    - not_null
  - name: district
    description: District name; empty values become null.
  - name: longitude
    description: Repaired longitude in decimal degrees.
  - name: latitude
    description: Repaired latitude in decimal degrees.
  - name: journey_count
    description: Number of journeys.
    data_tests:
    - not_null
  - name: passenger_count
    description: Number of passengers.
    data_tests:
    - not_null
  - name: source_last_modified
    description: Source modification timestamp.
  - name: ingested_at
    description: Ingestion timestamp with time zone.
