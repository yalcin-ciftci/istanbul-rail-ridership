version: 2
sources:
- name: raw
  schema: raw
  description: Unmodified IBB rail ridership data.
  tables:
  - name: rail_station_daily
    description: Daily ridership per source entrance row.
    columns:
    - name: _id
      description: Source row identifier.
    - name: transaction_year
      description: Ride year as text.
    - name: transaction_month
      description: Ride month as text.
    - name: transaction_day
      description: Ride day as text.
    - name: line
      description: Rail line name.
    - name: station_name
      description: Station name.
    - name: station_number
      description: Station code.
    - name: town
      description: District name, possibly empty.
    - name: longitude
      description: Longitude text with misplaced dots.
    - name: latitude
      description: Latitude text with misplaced dots.
    - name: passage_cnt
      description: Journey count as text.
    - name: passanger_cnt
      description: Passenger count with source spelling.
    - name: resource_id
      description: CKAN resource identifier.
    - name: source_last_modified
      description: Source modification timestamp.
    - name: ingested_at
      description: Ingestion timestamp with time zone.
