version: 2

unit_tests:
  - name: test_fix_turkish_mojibake
    model: stg_rail_station_daily
    given:
      - input: source('raw', 'rail_station_daily')
        rows:
          - {_id: 1, transaction_year: '2023', transaction_month: '1', transaction_day: '1', line: 'ýÝþÞðÐ', station_name: 'ýÝþÞðÐ', town: 'ýÝþÞðÐ'}
          - {_id: 2, transaction_year: '2023', transaction_month: '1', transaction_day: '1', line: 'M4-KADIKÖY', station_name: 'Acıbadem', town: 'Üsküdar'}
          - {_id: 3, transaction_year: '2023', transaction_month: '1', transaction_day: '1', line: null, station_name: null, town: null}
          - {_id: 4, transaction_year: '2023', transaction_month: '1', transaction_day: '1', line: '', station_name: '', town: ''}
    expect:
      rows:
        - {source_row_id: 1, line_name: 'ıİşŞğĞ', station_name: 'ıİşŞğĞ', district: 'ıİşŞğĞ'}
        - {source_row_id: 2, line_name: 'M4-KADIKÖY', station_name: 'Acıbadem', district: 'Üsküdar'}
        - {source_row_id: 3, line_name: null, station_name: null, district: null}
        - {source_row_id: 4, line_name: '', station_name: null, district: null}

  - name: test_empty_station_fields_become_null
    model: stg_rail_station_daily
    given:
      - input: source('raw', 'rail_station_daily')
        rows:
          - {_id: 1, transaction_year: '2022', transaction_month: '1', transaction_day: '1', station_number: '', station_name: ''}
          - {_id: 2, transaction_year: '2022', transaction_month: '1', transaction_day: '1', station_number: 'EMI-EMN', station_name: ''}
          - {_id: 3, transaction_year: '2022', transaction_month: '1', transaction_day: '1', station_number: null, station_name: null}
          - {_id: 4, transaction_year: '2022', transaction_month: '1', transaction_day: '1', station_number: 'ACM-AC1', station_name: 'Acýbadem'}
    expect:
      rows:
        - {source_row_id: 1, station_code: null, station_name: null, is_line_level: true}
        - {source_row_id: 2, station_code: 'EMI-EMN', station_name: null, is_line_level: false}
        - {source_row_id: 3, station_code: null, station_name: null, is_line_level: true}
        - {source_row_id: 4, station_code: 'ACM-AC1', station_name: 'Acıbadem', is_line_level: false}
