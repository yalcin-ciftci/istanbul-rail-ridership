version: 2

unit_tests:
  - name: test_station_latest_values_and_distinct_coordinate_pairs
    model: dim_station
    given:
      - input: ref('int_rail_entrance_daily')
        rows:
          - {source_row_id: 1, ride_date: '2021-01-01', station_code: S, station_name: Old, district: Old, line_name: M1, is_line_level: false, longitude: 28.0, latitude: 40.8}
          - {source_row_id: 2, ride_date: '2024-01-01', station_code: S, station_name: Previous, district: Previous, line_name: M1, is_line_level: false, longitude: 29.0, latitude: 41.0}
          - {source_row_id: 3, ride_date: '2024-01-02', station_code: S, station_name: Previous, district: Previous, line_name: M1, is_line_level: false, longitude: 29.0, latitude: 41.0}
          - {source_row_id: 4, ride_date: '2024-01-02', station_code: S, station_name: Previous, district: Previous, line_name: M2, is_line_level: false, longitude: 29.4, latitude: 41.4}
          - {source_row_id: 5, ride_date: '2025-01-01', station_code: S, station_name: LowerID, district: LatestDistrict, line_name: M2, is_line_level: false}
          - {source_row_id: 6, ride_date: '2025-01-01', station_code: S, station_name: LatestName, district: null, line_name: M2, is_line_level: false}
          - {source_row_id: 7, ride_date: '2025-01-02', station_code: S, station_name: null, district: null, line_name: M2, is_line_level: false}
          - {source_row_id: 8, ride_date: '2025-01-01', station_code: N, station_name: NoCoordinates, line_name: M1, is_line_level: false}
          - {source_row_id: 9, ride_date: '2025-01-01', station_code: null, station_name: null, line_name: T3, is_line_level: true}
      - input: ref('station_group_map')
        rows:
          - {station_code: S, station_group: Shared}
          - {station_code: N, station_group: Other}
    expect:
      rows:
        - {station_code: S, station_name: LatestName, district: LatestDistrict, longitude: 29.2, latitude: 41.2, first_seen_date: '2021-01-01', last_seen_date: '2025-01-02', line_count: 2}
        - {station_code: N, station_name: NoCoordinates, district: null, longitude: null, latitude: null, first_seen_date: '2025-01-01', last_seen_date: '2025-01-01', line_count: 1}
  - name: test_line_codes_and_line_level_flag
    model: dim_line
    given:
      - input: ref('int_rail_entrance_daily')
        rows:
          - {line_name: M4-KADIKOY, ride_date: '2021-01-01', is_line_level: false}
          - {line_name: M4-KADIKOY, ride_date: '2025-01-01', is_line_level: true}
          - {line_name: IETT NOSTALJIK TRAMVAY, ride_date: '2023-01-01', is_line_level: true}
          - {line_name: TCDD-MARMARAY, ride_date: '2023-01-01', is_line_level: false}
          - {line_name: T5, ride_date: '2023-01-01', is_line_level: false}
    expect:
      rows:
        - {line_name: M4-KADIKOY, line_code: M4, has_line_level_rows: true, first_seen_date: '2021-01-01', last_seen_date: '2025-01-01'}
        - {line_name: IETT NOSTALJIK TRAMVAY, line_code: IETT, has_line_level_rows: true, first_seen_date: '2023-01-01', last_seen_date: '2023-01-01'}
        - {line_name: TCDD-MARMARAY, line_code: TCDD, has_line_level_rows: false, first_seen_date: '2023-01-01', last_seen_date: '2023-01-01'}
        - {line_name: T5, line_code: T5, has_line_level_rows: false, first_seen_date: '2023-01-01', last_seen_date: '2023-01-01'}
  - name: test_station_daily_sums_entrances_excludes_line_totals
    model: fct_station_daily
    given:
      - input: ref('int_rail_entrance_daily')
        rows:
          - {ride_date: '2025-01-01', line_name: M1, station_code: S, is_line_level: false, journey_count: 10, passenger_count: 5}
          - {ride_date: '2025-01-01', line_name: M1, station_code: S, is_line_level: false, journey_count: 20, passenger_count: 8}
          - {ride_date: '2025-01-01', line_name: M2, station_code: S, is_line_level: false, journey_count: 7, passenger_count: 4}
          - {ride_date: '2025-01-01', line_name: M1, station_code: null, is_line_level: true, journey_count: 100, passenger_count: 50}
    expect:
      rows:
        - {ride_date: '2025-01-01', station_code: S, line_name: M1, journey_count: 30, passenger_count: 13, entrance_rows: 2}
        - {ride_date: '2025-01-01', station_code: S, line_name: M2, journey_count: 7, passenger_count: 4, entrance_rows: 1}
  - name: test_line_daily_includes_line_totals_counts_distinct_stations
    model: fct_line_daily
    given:
      - input: ref('int_rail_entrance_daily')
        rows:
          - {ride_date: '2025-01-01', line_name: M1, station_code: S, is_line_level: false, journey_count: 10, passenger_count: 5}
          - {ride_date: '2025-01-01', line_name: M1, station_code: S, is_line_level: false, journey_count: 20, passenger_count: 8}
          - {ride_date: '2025-01-01', line_name: M1, station_code: null, is_line_level: true, journey_count: 100, passenger_count: 50}
          - {ride_date: '2025-01-01', line_name: T3, station_code: null, is_line_level: true, journey_count: 7, passenger_count: 4}
    expect:
      rows:
        - {ride_date: '2025-01-01', line_name: M1, journey_count: 130, passenger_count: 63, station_count: 1, has_line_level_rows: true}
        - {ride_date: '2025-01-01', line_name: T3, journey_count: 7, passenger_count: 4, station_count: 0, has_line_level_rows: true}
