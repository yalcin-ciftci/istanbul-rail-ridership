name: istanbul_ulasim
profile: istanbul_ulasim
config-version: 2
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
flags: {send_anonymous_usage_stats: false}
models:
  istanbul_ulasim:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    hourly:
      +schema: hourly
      +materialized: table
      +persist_docs: {relation: true, columns: true}
    marts:
      +materialized: table
      +schema: marts
      +persist_docs: {relation: true, columns: true}
seeds:
  istanbul_ulasim:
    +schema: marts
    +persist_docs: {relation: true, columns: true}
    station_group_map:
      +column_types:
        station_code: varchar
        station_name: varchar
        station_group: varchar
        status: varchar
        note: varchar
    external_line_map:
      +schema: intermediate
      +column_types:
        line_code: varchar
        daily_line_name: varchar
    external_annual_totals:
      +schema: intermediate
      +column_types:
        line_code: varchar
        year: integer
        operator: varchar
        measure: varchar
        value: bigint
        source_url: varchar
        source_page: varchar
        note: varchar
    journey_suspect_overrides:
      +column_types:
        ride_date: date
        reason: varchar
        evidence: varchar
    hourly_line_map:
      +schema: hourly
      +column_types:
        line_code: varchar
        daily_line_name: varchar
        note: varchar
    hourly_station_map:
      +schema: hourly
      +column_types:
        line_code: varchar
        station_key: varchar
        station_name_raw: varchar
        station_group: varchar
        match_method: varchar
        note: varchar
    calendar_events:
      +schema: intermediate
      +column_types:
        start_date: date
        end_date: date
        event_type: varchar
        label_tr: varchar
        scope: varchar
        partial_day: boolean
        source_url: varchar
