name: istanbul_ulasim
profile: istanbul_ulasim
config-version: 2
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
flags: {send_anonymous_usage_stats: false}
models:
  istanbul_ulasim:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      +persist_docs: {relation: true, columns: true}
seeds:
  istanbul_ulasim:
    +schema: marts
    +persist_docs: {relation: true, columns: true}
    station_group_map:
      +column_types:
        station_code: varchar
        station_name: varchar
        station_group: varchar
        status: varchar
        note: varchar
